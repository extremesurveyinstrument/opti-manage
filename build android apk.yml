on:
  push:
    branches: [ "main" ] # Triggers the build when you push to the main branch
  workflow_dispatch: # Allows you to trigger the build manually from the Actions tab

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Build Web Assets
        run: npm run build

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v2

      - name: Install Capacitor
        run: |
          npm install @capacitor/core @capacitor/cli
          npx cap init "Opti Manage" "com.optimanage.app" --web-dir dist
          npm install @capacitor/android
          npx cap add android

      - name: Sync Web Assets to Android
        run: npx cap sync android

      - name: Build APK
        working-directory: ./android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: opti-manage-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
